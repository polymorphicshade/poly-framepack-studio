# poly-framepack-studio on an NVIDIA GPU, over plain HTTP.
#
#   cp .env.example .env      # optional: port, LoRA folder, serve flags, ...
#   mkdir -p loras            # so the LoRA folder is owned by you, not root
#   docker compose up -d --build
#   http://<host>:7860            (HTTP API at /api, docs at /docs)
#
# For HTTPS, use docker-compose.https.yml instead.

services:
  app:
    build:
      context: .
      args:
        # Attention backend and how it is built (see .env.example).
        ATTENTION: ${ATTENTION:-sage}
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.0;8.6;8.9;9.0;12.0}
        MAX_JOBS: ${MAX_JOBS:-1}
        NVCC_THREADS: ${NVCC_THREADS:-2}
    image: poly-framepack-studio:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:7860"
    environment:
      FRAMEPACK_SERVE_ARGS: ${FRAMEPACK_SERVE_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - state:/data
      - models:/data/cache
      - outputs:/data/outputs
      - ${LORAS_DIR:-./loras}:/data/loras
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  state:       # settings, presets, the queue, uploaded inputs and temp files
  models:      # model weights (~25 GB per model family, plus the shared text encoders)
  outputs:     # generated videos and metadata
